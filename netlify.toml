# netlify.toml

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 캐싱 헤더 설정 (성능 최적화)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 리디렉션 규칙 (SPA 대비)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 404 페이지 처리
[[redirects]]
  from = "/404.html"
  to = "/404"
  status = 200